<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f5" />
    <meta name="description" content="فایل‌استور؛ کتاب‌های دیجیتال برای مسیرهای تازه‌ی یادگیری." />
    <script>
      try {
        const savedTheme = localStorage.getItem('fs-theme');
        const theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <title>فایل‌استور | کتاب بعدی‌ات را پیدا کن</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
